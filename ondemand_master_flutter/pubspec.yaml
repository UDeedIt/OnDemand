name: ondemand_master
description: "App for Masters for OnDemand services project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.0
  iconsax: ^0.0.8

  # State Management (BLoC)
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  bloc: ^9.2.1  # ← Changed from ^8.1.4 to ^9.2.1

  # HTTP & API Client
  dio: ^5.4.0
  dio_smart_retry: ^7.0.0

  # Routing
  go_router: ^13.2.0

  # Local Database (SQLite with Drift)
  drift: ^2.19.0
  drift_sqflite: ^2.0.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # JSON Serialization & Freezed (Immutable Data Classes)
  json_serializable: ^6.8.0
  json_annotation: ^4.8.1
  freezed_annotation: ^3.1.0

  # Dependency Injection & Utilities
  get_it: ^7.6.0
  logger: ^2.1.0
  intl: ^0.19.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation Tools
  build_runner: ^2.4.11
  drift_dev: ^2.19.0
  json_serializable: ^6.8.0
  freezed: ^3.2.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
